<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A" />
      <stop offset="60%" stop-color="#8B1A1A" />
      <stop offset="100%" stop-color="#5C0E0E" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Blood Droplet -->
  <path d="M50 10 C50 10 20 50 20 70 A30 30 0 0 0 80 70 C80 50 50 10 50 10 Z"
        fill="url(#dropGrad)" filter="url(#subtleShadow)" />
  <!-- Medical Cross / Pulse inside Droplet -->
  <path d="M46 50 H54 V58 H62 V66 H54 V74 H46 V66 H38 V58 H46 Z"
        fill="#FFFFFF" opacity="0.95" />
